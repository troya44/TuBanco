<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes de Perfil | TuBanco</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --navy: #1e293b;
            --slate: #64748b;
            --bg: #f8fafc;
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(76, 175, 80, 0.05) 0px, transparent 50%), 
                              radial-gradient(at 100% 0%, rgba(30, 41, 59, 0.05) 0px, transparent 50%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER DEL PERFIL */
        .profile-header {
            background: var(--navy);
            padding: 40px;
            color: white;
            display: flex;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        .profile-header::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }

        .avatar-container {
            position: relative;
            z-index: 1;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 40px;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .header-info h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-info p {
            margin: 5px 0 0 0;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        /* CUERPO DE LA PÁGINA */
        .content {
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .section-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            padding: 25px;
            border-radius: 24px;
            transition: transform 0.3s ease;
        }

        h3 {
            margin-top: 0;
            color: var(--navy);
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* MENSAJES */
        .alert {
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error { background: #fee2e2; color: var(--error); border: 1px solid #fecaca; }
        .alert-exito { background: #dcfce7; color: var(--success); border: 1px solid #bbf7d0; }

        /* FORMULARIOS */
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--slate);
            margin-bottom: 8px;
        }

        input[type="text"], input[type="number"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .btn {
            cursor: pointer;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.2);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: var(--navy);
            padding: 10px 20px;
            margin-top: 15px;
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: var(--navy);
        }

        /* ÁREA DE CONFIRMACIÓN CRÍTICA */
        .critical-section {
            background: #f8fafc;
            border: 2px dashed #e2e8f0;
            padding: 25px;
            border-radius: 24px;
        }

        .badge-limit {
            background: rgba(76, 175, 80, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .back-link a {
            color: var(--slate);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link a:hover { color: var(--navy); }
    </style>
</head>

<body>
    <div class="container">
        <!-- HEADER CON ESTILO BANCARIO -->
        <div class="profile-header">
            <div class="avatar-container">
                <img th:src="${usuario.fotoPerfil != null ? '/imagenes/' + usuario.fotoPerfil : 'https://ui-avatars.com/api/?name=User&background=4CAF50&color=fff'}" 
                     class="avatar-img" alt="Foto de perfil">
            </div>
            <div class="header-info">
                <h2 th:text="${#strings.toUpperCase(usuario.nombre)}">NOMBRE USUARIO</h2>
                <p>Gestiona tu seguridad y preferencias de cuenta</p>
            </div>
        </div>

        <div class="content">
            <!-- MENSAJES DE FEEDBACK -->
            <div th:if="${error}" class="alert alert-error">
                <i>⚠️</i> <span th:text="${error}"></span>
            </div>
            <div th:if="${exito}" class="alert alert-exito">
                <i>✅</i> <span th:text="${exito}"></span>
            </div>

            <!-- SECCIÓN 1: FOTO -->
            <div class="section-card">
                <h3> Actualizar Imagen</h3>
                <form th:action="@{/perfil/subir-foto}" method="post" enctype="multipart/form-data">
                    <input type="file" name="archivo" accept="image/*" required>
                    <button type="submit" class="btn btn-outline">Subir nueva foto</button>
                </form>
            </div>

            <!-- FORMULARIO PRINCIPAL -->
            <form th:action="@{/perfil/actualizar-seguridad}" method="post">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <!-- SECCIÓN 2: LÍMITE -->
                    <div class="section-card">
                        <h3> Límite Mensual</h3>
                        <label>Límite actual: <span class="badge-limit" th:text="${usuario.limiteMensual} + ' €'">1000€</span></label>
                        <input type="number" name="nuevoLimite" step="0.01" th:placeholder="${usuario.limiteMensual}">
                    </div>

                    <!-- SECCIÓN 3: PASSWORD -->
                    <div class="section-card">
                        <h3> Seguridad</h3>
                        <label>Nueva contraseña</label>
                        <input type="password" name="nuevaPassword" placeholder="Dejar en blanco para no cambiar">
                    </div>
                </div>

                <!-- SECCIÓN 4: CONFIRMACIÓN -->
                <div class="critical-section" style="margin-top: 30px;">
                    <h3 style="color: var(--error);"> Verificación Requerida</h3>
                    <p style="font-size: 0.85rem; color: var(--slate); margin-bottom: 20px;">
                        Para guardar los cambios en tus límites o contraseña, introduce tu <b>contraseña actual</b>.
                    </p>
                    <input type="password" name="passwordActual" required placeholder="Contraseña actual" style="margin-bottom: 20px;">
                    <button type="submit" class="btn btn-primary">Guardar Ajustes de Seguridad</button>
                </div>
            </form>
        </div>

        <div class="back-link">
            <a href="/tubanco">← Volver al Panel Principal</a>
        </div>
    </div>
</body>

</html>
