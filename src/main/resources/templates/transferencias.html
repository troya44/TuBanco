<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia Segura | TuBanco</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Paleta basada en el estilo del logo: Navy y Green */
            --primary: #4CAF50;
            /* Verde Esmeralda */
            --secondary: #1e293b;
            /* Azul Navy Oscuro */
            --accent: #81c784;
            /* Verde Claro */
            --dark: #0f172a;
            /* Fondo Sidebar/Texto */
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        /* Decoración de fondo animada en tonos verdes */
        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.15), transparent 70%);
            top: -150px;
            right: -100px;
            z-index: -1;
            animation: float 12s infinite alternate;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-40px, 40px);
            }
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1);
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        h2 {
            color: var(--secondary);
            font-weight: 800;
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            text-align: left;
            letter-spacing: -0.8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: block;
            font-weight: 500;
        }

        /* Caja de Saldo - Estilo Navy Premium */
        .balance-card {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--dark) 100%);
            color: white;
            padding: 25px;
            border-radius: 24px;
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.25);
        }

        .balance-card::after {
            content: "";
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 120px;
            height: 120px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 50%;
            filter: blur(20px);
        }

        .balance-label {
            font-size: 0.75rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .balance-amount {
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 5px;
            display: block;
            color: var(--primary);
        }

        /* Inputs */
        .input-wrapper {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            transition: 0.3s;
            background: #f8fafc;
            box-sizing: border-box;
            color: var(--dark);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        /* Botón Verde (Mismo que el logo) */
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }

        button:hover {
            background: #43a047;
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(76, 175, 80, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--secondary);
        }

        .back-link svg {
            margin-right: 8px;
            transition: transform 0.3s;
        }

        .back-link:hover svg {
            transform: translateX(-5px);
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Nueva Transferencia</h2>
        <span class="subtitle">Mueve tus fondos con seguridad total</span>

        <div class="balance-card">
            <span class="balance-label">Tu saldo disponible</span>
            <!-- Thymeleaf: Formateo de moneda -->
            <span class="balance-amount"
                th:text="${saldo != null ? #numbers.formatDecimal(saldo, 1, 2) + ' €' : '0.00 €'}">0.00 €</span>
        </div>

        <form th:action="@{/transferir}" method="post">
            <div class="input-wrapper">
                <label>Beneficiario (Email)</label>
                <input type="email" name="emailDestino" placeholder="correo@ejemplo.com" required>
            </div>
            <!-- Bloque de alerta de error -->
            <div th:if="${error}"
                style="background: #fee2e2; border: 1px solid #ef4444; color: #ef4444; padding: 15px; border-radius: 16px; margin-bottom: 25px; font-weight: 700; text-align: center; font-size: 0.9rem;">
                <svg style="vertical-align: middle; margin-right: 8px;" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span th:text="${error}">Mensaje de error</span>
            </div>

            <div class="input-wrapper">
                <label>Importe a enviar</label>
                <!-- Usamos el saldo como límite máximo dinámico -->
                <input type="number" name="cantidad" step="0.01" min="0.01" th:max="${saldo}" placeholder="0.00 €"
                    required>
            </div>

            <button type="submit">Ejecutar Envío Seguro</button>
        </form>

        <a href="/tubanco" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Cancelar y volver al panel
        </a>
    </div>
</body>

</html>
